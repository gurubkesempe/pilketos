<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Panitia — Pemilihan Ketua OSIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#182642; --ink-2:#25355C; --ink-soft:#57628A;
  --paper:#F1ECDD; --paper-2:#E7DFC9; --paper-line: rgba(24,38,66,0.14);
  --gold:#B7912E; --gold-soft:#DDC98A;
  --red:#A23B34; --red-soft:#C97A70; --good:#3F6B4C;
  --shadow: 0 18px 40px -20px rgba(24,38,66,0.35); --radius: 6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#F1ECDD;color:var(--ink);font-family:'IBM Plex Sans', sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Fraunces', serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* login screen */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 15% -10%, #1F3057 0%, var(--ink) 55%), var(--ink); padding:20px;}
.admin-card{width:100%;max-width:380px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 30px;}
.admin-card .eyebrow{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-family:'Fraunces',serif;font-size:20px;color:var(--gold);}
.admin-card h1{font-size:22px;margin:0 0 6px;}
.admin-card p.sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--paper-line);border-radius:4px;background:#FBF9F2;font-size:15px;color:var(--ink);}
.field input:focus,.field textarea:focus{border-color:var(--ink-soft);}
.submit-btn{width:100%;padding:13px;border:none;border-radius:4px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600;margin-top:6px;}
.submit-btn:hover{background:var(--ink-2);}
.submit-btn:disabled{opacity:.6;}
.form-error{background:#F6E3E0;border:1px solid #E3B9B3;color:#8F332D;font-size:13px;padding:10px 12px;border-radius:4px;margin-bottom:16px;}

/* app shell */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,3vw,36px);background:var(--ink);color:var(--paper);}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:14px;color:var(--gold-soft);}
.brand-text .school{font-size:11.5px;color:var(--gold-soft);margin:0;}
.brand-text .title{font-size:15px;margin:0;font-weight:600;}
.topbar .who{display:flex;align-items:center;gap:14px;font-size:13.5px;color:#C9D0E3;}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#C9D0E3;padding:6px 13px;border-radius:999px;font-size:12.5px;}
.logout-btn:hover{border-color:var(--gold-soft);color:var(--paper);}

.tabs{display:flex;gap:4px;padding:0 clamp(16px,3vw,36px);background:var(--ink-2);}
.tab-btn{background:none;border:none;color:#C9D0E3;padding:13px 18px;font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--paper);border-bottom-color:var(--gold);}

.main{flex:1;padding:26px clamp(16px,3vw,36px) 60px;max-width:1080px;width:100%;margin:0 auto;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:20px;margin:0;}
.section-head p{font-size:13px;color:var(--ink-soft);margin:2px 0 0;}
.btn{padding:10px 16px;border-radius:4px;font-size:13.5px;font-weight:600;border:none;}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{background:var(--ink-2);}
.btn-outline{background:transparent;border:1.5px solid var(--paper-line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:var(--red);color:#F6EFE4;}
.btn-danger:hover{background:#8F332D;}
.btn:disabled{opacity:.55;cursor:default;}

.net-error{background:#F6E3E0;border:1px solid #E3B9B3;color:#8F332D;font-size:13.5px;padding:11px 14px;border-radius:4px;margin-bottom:16px;}
.net-ok{background:#E4EEE7;border:1px solid #BFE0CB;color:#2E4F3A;font-size:13.5px;padding:11px 14px;border-radius:4px;margin-bottom:16px;}

/* candidate table */
.cand-table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.cand-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:12px 14px;background:var(--paper-2);}
.cand-table td{padding:12px 14px;border-top:1px solid var(--paper-line);font-size:14px;vertical-align:middle;}
.cand-thumb{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--paper-2);}
.cand-nomor{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--gold-soft);align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:'Fraunces',serif;}
.row-actions{display:flex;gap:8px;}
.row-actions button{padding:6px 12px;font-size:12.5px;border-radius:4px;}
.empty-note{padding:30px;text-align:center;color:var(--ink-soft);font-size:14px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);}

/* candidate form modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,22,40,0.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;overflow-y:auto;}
.modal-box{background:var(--paper);border-radius:var(--radius);max-width:520px;width:100%;padding:28px 26px;box-shadow:var(--shadow);margin:auto;}
.modal-box h3{margin:0 0 18px;font-size:19px;}
.modal-box .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.modal-actions button{flex:1;padding:11px;border-radius:4px;font-size:14px;font-weight:600;}
.modal-actions .cancel{background:transparent;border:1.5px solid var(--paper-line);color:var(--ink-soft);}
.modal-actions .confirm{background:var(--ink);border:none;color:var(--paper);}
.photo-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--paper-2);border:1px solid var(--paper-line);}
.field-note{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

/* confirm delete */
.confirm-box{max-width:380px;}

/* monitor tab */
.monitor-grid{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start;}
.stat-card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;text-align:center;}
.ring-wrap{position:relative;width:170px;height:170px;margin:0 auto 16px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--paper-2);stroke-width:9;}
.ring-fill{fill:none;stroke:var(--red);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,.7,.2,1);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-center .count{font-family:'Fraunces',serif;font-size:36px;font-weight:600;line-height:1;}
.ring-center .of{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.stat-card h3{font-size:15px;margin:0 0 4px;}
.stat-card .sub{font-size:12.5px;color:var(--ink-soft);}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.tally-card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;}
.tally-card h3{margin:0 0 4px;font-size:16px;}
.tally-card .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;}
.tally-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.tally-row:last-child{margin-bottom:0;}
.tally-row .tn{width:24px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
.tally-row .tname{font-size:13px;font-weight:600;width:120px;flex-shrink:0;}
.tally-track{flex:1;height:18px;background:var(--paper-2);border-radius:3px;overflow:hidden;}
.tally-fill{height:100%;background:var(--ink-soft);border-radius:3px;transition:width .8s cubic-bezier(.3,.7,.2,1);}
.tally-row.lead .tally-fill{background:var(--gold);}
.tally-row .tv{width:60px;text-align:right;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}

.publish-box{margin-top:20px;padding-top:18px;border-top:1px dashed var(--paper-line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.publish-box .txt{font-size:13px;color:var(--ink-soft);max-width:360px;}
.published-badge{display:inline-flex;align-items:center;gap:6px;background:#E4EEE7;color:#2E4F3A;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;}

/* countdown overlay */
.countdown-screen{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;}
.countdown-label{color:var(--gold-soft);font-size:14px;letter-spacing:.04em;margin-bottom:18px;}
.countdown-num{font-family:'Fraunces',serif;font-size:150px;font-weight:600;color:var(--paper);line-height:1;animation:tick .85s ease-out;}
@keyframes tick{from{transform:scale(1.35);opacity:0;}to{transform:scale(1);opacity:1;}}
.countdown-sub{color:#C9D0E3;font-size:14.5px;margin-top:18px;}

@media (max-width:820px){
  .monitor-grid{grid-template-columns:1fr;}
  .modal-box .grid2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   KONFIGURASI
   ========================================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxD10hlyDmINnYCBpZF2aZK4aUPYG-4_rkvhMYZbI5et_pm0L8fATlY101vsHSa0gdp/exec";
const SEKOLAH = "SMP 2 Sragi";
const TAHUN_AJARAN = "2026/2027";
const TALLY_POLL_MS = 5000;

function apiConfigured(){ return API_URL && API_URL.indexOf('TEMPEL_URL') === -1; }
async function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API_URL + '?' + qs);
  if(!res.ok) throw new Error('Gagal terhubung ke server (' + res.status + ')');
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('Gagal terhubung ke server (' + res.status + ')');
  return res.json();
}

const state = {
  screen: apiConfigured() ? 'login' : 'setup', // login | app
  tab: 'kandidat', // kandidat | pantau
  admin:null,
  loginError:'',
  submitting:false,
  netError:'', netOk:'',
  candidates:[],
  voterCount:0, totalSiswa:0, tally:null, published:false,
  editingCandidate:null, // object saat edit, {} saat tambah baru, null saat modal tertutup
  photoBase64:null, photoType:null, photoName:null,
  deleteTarget:null,
  pollHandle:null,
  countdown:null
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fallbackAvatar(nama){ return 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(nama||'?'); }

const app = document.getElementById('app');

function render(){
  if(state.screen === 'setup'){ app.innerHTML = screenSetup(); return; }
  if(state.screen === 'login'){ app.innerHTML = screenLogin(); return; }

  app.innerHTML = `
    <div class="app-shell">
      ${topbar()}
      <div class="tabs">
        <button class="tab-btn ${state.tab==='kandidat'?'active':''}" data-action="tab" data-tab="kandidat">Kelola Kandidat</button>
        <button class="tab-btn ${state.tab==='pantau'?'active':''}" data-action="tab" data-tab="pantau">Pantau Suara</button>
      </div>
      <div class="main">
        ${state.netError ? '<div class="net-error">'+esc(state.netError)+'</div>' : ''}
        ${state.netOk ? '<div class="net-ok">'+esc(state.netOk)+'</div>' : ''}
        ${state.tab === 'kandidat' ? tabKandidat() : tabPantau()}
      </div>
    </div>`;

  if(state.editingCandidate !== null) app.innerHTML += modalCandidateForm(state.editingCandidate);
  if(state.deleteTarget) app.innerHTML += modalConfirmDelete(state.deleteTarget);
  if(state.countdown !== null) app.innerHTML += screenCountdown();
}

function topbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <p class="school">${esc(SEKOLAH)} · ${esc(TAHUN_AJARAN)}</p>
        <p class="title">Dashboard Panitia Pilketos</p>
      </div>
    </div>
    <div class="who">
      <span>${esc(state.admin.nama)}</span>
      <button class="logout-btn" data-action="logout">Keluar</button>
    </div>
  </div>`;
}

function screenSetup(){
  return `<div class="login-shell"><div class="admin-card">
    <h1>Belum dikonfigurasi</h1>
    <p class="sub">Isi <code>API_URL</code> di bagian atas file ini dengan URL Web App Google Apps Script kamu.</p>
  </div></div>`;
}

function screenLogin(){
  return `
  <div class="login-shell">
    <div class="admin-card">
      <div class="eyebrow">P</div>
      <h1>Dashboard Panitia</h1>
      <p class="sub">Khusus panitia pemilihan ketua OSIS. Kelola kandidat &amp; pantau jalannya suara.</p>
      ${state.loginError ? '<div class="form-error">'+esc(state.loginError)+'</div>' : ''}
      <div class="field">
        <label for="in-user">Username</label>
        <input id="in-user" autocomplete="username" placeholder="username panitia">
      </div>
      <div class="field">
        <label for="in-pass">Password</label>
        <input id="in-pass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="submit-btn" data-action="login" ${state.submitting?'disabled':''}>${state.submitting?'Memeriksa…':'Masuk Dashboard'}</button>
    </div>
  </div>`;
}

/* ============ tab: kelola kandidat ============ */
function tabKandidat(){
  const rows = state.candidates
    .slice()
    .sort((a,b)=> Number(a.nomor)-Number(b.nomor))
    .map(c => `
    <tr>
      <td><span class="cand-nomor">${esc(c.nomor)}</span></td>
      <td><img class="cand-thumb" src="${esc(c.foto)||fallbackAvatar(c.nama)}" data-fallback="${esc(encodeURIComponent(c.nama))}" alt=""></td>
      <td><strong>${esc(c.nama)}</strong></td>
      <td>${esc(c.kelas)}</td>
      <td>
        <div class="row-actions">
          <button class="btn btn-outline" data-action="edit-candidate" data-nomor="${esc(c.nomor)}">Edit</button>
          <button class="btn btn-danger" data-action="ask-delete" data-nomor="${esc(c.nomor)}">Hapus</button>
        </div>
      </td>
    </tr>`).join('');

  return `
  <div class="section-head">
    <div>
      <h2>Kelola Kandidat</h2>
      <p>${state.candidates.length} kandidat terdaftar</p>
    </div>
    <button class="btn btn-primary" data-action="add-candidate">+ Tambah Kandidat</button>
  </div>
  ${state.candidates.length === 0 ? '<div class="empty-note">Belum ada kandidat. Klik "Tambah Kandidat" untuk mulai.</div>' : `
  <table class="cand-table">
    <thead><tr><th>No.</th><th>Foto</th><th>Nama</th><th>Kelas</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`}`;
}

function modalCandidateForm(c){
  const isNew = !c.nomor;
  const misiText = Array.isArray(c.misi) ? c.misi.join('\n') : (c.misi||'');
  const previewSrc = state.photoBase64 ? ('data:'+state.photoType+';base64,'+state.photoBase64) : (c.foto || '');
  return `
  <div class="modal-overlay" data-action="close-candidate-modal">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>${isNew ? 'Tambah Kandidat' : 'Edit Kandidat'}</h3>
      <div class="photo-row">
        <img class="photo-preview" src="${esc(previewSrc)||fallbackAvatar(c.nama||'?')}" alt="">
        <div>
          <input type="file" id="cf-foto" accept="image/*">
          <p class="field-note">JPG/PNG, maks 5 MB. Kosongkan jika tidak ganti foto.</p>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="cf-nomor">Nomor urut</label>
          <input id="cf-nomor" inputmode="numeric" value="${esc(c.nomor||'')}" ${isNew?'':'disabled'} placeholder="1">
        </div>
        <div class="field">
          <label for="cf-kelas">Kelas</label>
          <input id="cf-kelas" value="${esc(c.kelas||'')}" placeholder="Contoh: IX A">
        </div>
      </div>
      <div class="field">
        <label for="cf-nama">Nama lengkap</label>
        <input id="cf-nama" value="${esc(c.nama||'')}" placeholder="Nama kandidat">
      </div>
      <div class="field">
        <label for="cf-visi">Visi</label>
        <input id="cf-visi" value="${esc(c.visi||'')}" placeholder="Satu kalimat visi">
      </div>
      <div class="field">
        <label for="cf-misi">Misi (satu baris = satu poin)</label>
        <textarea id="cf-misi" rows="4" placeholder="Misi 1&#10;Misi 2&#10;Misi 3">${esc(misiText)}</textarea>
      </div>
      ${state.formError ? '<div class="form-error">'+esc(state.formError)+'</div>' : ''}
      <div class="modal-actions">
        <button class="cancel" data-action="close-candidate-modal">Batal</button>
        <button class="confirm" data-action="save-candidate" ${state.submitting?'disabled':''}>${state.submitting?'Menyimpan…':'Simpan'}</button>
      </div>
    </div>
  </div>`;
}

function modalConfirmDelete(c){
  return `
  <div class="modal-overlay" data-action="close-delete-modal">
    <div class="modal-box confirm-box" onclick="event.stopPropagation()">
      <h3>Hapus kandidat?</h3>
      <p style="font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 20px;">Nomor ${esc(c.nomor)} — <strong>${esc(c.nama)}</strong> akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.</p>
      <div class="modal-actions">
        <button class="cancel" data-action="close-delete-modal">Batal</button>
        <button class="btn-danger" style="flex:1;border-radius:4px;" data-action="confirm-delete" ${state.submitting?'disabled':''}>${state.submitting?'Menghapus…':'Ya, hapus'}</button>
      </div>
    </div>
  </div>`;
}

/* ============ tab: pantau suara ============ */
function tabPantau(){
  const total = state.totalSiswa || 0;
  const count = state.voterCount || 0;
  const pct = total > 0 ? Math.min(1, count/total) : 0;
  const r = 78, circ = 2*Math.PI*r;
  const offset = circ * (1-pct);

  const tally = state.tally || {};
  const ranked = state.candidates
    .map(c => ({...c, votes: tally[c.nomor]||0}))
    .sort((a,b)=> b.votes - a.votes);
  const maxVotes = ranked[0] ? Math.max(1, ranked[0].votes) : 1;

  const tallyRows = ranked.map((c,i) => `
    <div class="tally-row ${i===0 && c.votes>0 ?'lead':''}">
      <div class="tn">${i+1}</div>
      <div class="tname">${esc(c.nama)}</div>
      <div class="tally-track"><div class="tally-fill" style="width:${(c.votes/maxVotes*100).toFixed(0)}%"></div></div>
      <div class="tv">${c.votes} suara</div>
    </div>`).join('');

  return `
  <div class="section-head">
    <div>
      <h2>Pantau Suara</h2>
      <p>Diperbarui otomatis tiap ${Math.round(TALLY_POLL_MS/1000)} detik</p>
    </div>
    <button class="btn btn-outline" data-action="refresh-pantau">Segarkan sekarang</button>
  </div>
  <div class="monitor-grid">
    <div class="stat-card">
      <div class="ring-wrap">
        <svg width="170" height="170" viewBox="0 0 170 170">
          <circle class="ring-track" cx="85" cy="85" r="${r}" transform="rotate(-90 85 85)"/>
          <circle class="ring-fill" cx="85" cy="85" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 85 85)"/>
        </svg>
        <div class="ring-center">
          <div class="count">${count}</div>
          <div class="of">dari ${total} siswa</div>
        </div>
      </div>
      <h3><span class="live-dot"></span>Partisipasi</h3>
      <p class="sub">${(pct*100).toFixed(0)}% siswa sudah memilih</p>
    </div>
    <div class="tally-card">
      <h3>Perolehan Suara Live</h3>
      <p class="sub">Data ini hanya terlihat oleh panitia sampai hasil diumumkan.</p>
      ${ranked.length ? tallyRows : '<p style="font-size:13.5px;color:var(--ink-soft);">Belum ada kandidat.</p>'}
      <div class="publish-box">
        ${state.published
          ? `<span class="published-badge">✓ Hasil sudah diumumkan ke siswa</span>
             <button class="btn btn-outline" data-action="unpublish">Batalkan pengumuman</button>`
          : `<span class="txt">Kalau proses pemilihan sudah selesai, umumkan hasil final. Siswa akan langsung melihat pemenang di halaman pemantauan mereka.</span>
             <button class="btn btn-primary" data-action="start-publish" ${state.submitting?'disabled':''}>Hitung Suara Akhir &amp; Umumkan</button>`
        }
      </div>
    </div>
  </div>`;
}

function screenCountdown(){
  const v = state.countdown;
  return `
  <div class="countdown-screen">
    <div class="countdown-label">MENGHITUNG SUARA</div>
    <div class="countdown-num">${v > 0 ? v : '—'}</div>
    <div class="countdown-sub">${v > 0 ? 'Bersiap mengumumkan…' : 'Mengumumkan hasil…'}</div>
  </div>`;
}

/* ============ actions: login ============ */
async function handleLogin(){
  state.loginError = '';
  const username = document.getElementById('in-user').value.trim();
  const password = document.getElementById('in-pass').value.trim();
  if(!username || !password){ state.loginError = 'Isi username dan password.'; render(); return; }
  state.submitting = true; render();
  try{
    const res = await apiPost({action:'adminLogin', username, password});
    if(!res.ok){ state.loginError = res.error || 'Login gagal.'; state.submitting=false; render(); return; }
    state.admin = {username, nama: res.nama || username};
    state.submitting = false;
    state.screen = 'app';
    await loadAll();
    startPolling();
  }catch(err){
    state.loginError = 'Gagal terhubung ke server. Coba lagi.'; state.submitting=false; render();
  }
}

async function loadAll(){
  try{
    const [cand, voterCount, totalSiswa, status] = await Promise.all([
      apiGet({action:'getCandidates'}),
      apiGet({action:'getVoterCount'}),
      apiGet({action:'getTotalSiswa'}),
      apiGet({action:'getResultStatus'})
    ]);
    state.candidates = Array.isArray(cand) ? cand : [];
    state.voterCount = voterCount.count || 0;
    state.totalSiswa = totalSiswa.total || 0;
    state.published = !!status.published;
    // Ambil tally live (admin selalu boleh lihat, terlepas dari status publish)
    const t = await apiGet({action:'getTally'});
    state.tally = t.tally || {};
  }catch(err){
    state.netError = 'Gagal memuat sebagian data dari server.';
  }
  render();
}

function startPolling(){
  if(state.pollHandle) clearInterval(state.pollHandle);
  state.pollHandle = setInterval(() => {
    if(state.screen === 'app' && state.tab === 'pantau' && state.countdown === null) loadAll();
  }, TALLY_POLL_MS);
}

/* ============ actions: kandidat CRUD ============ */
function openAddCandidate(){
  state.editingCandidate = {};
  state.photoBase64 = null; state.photoType = null; state.photoName = null;
  state.formError = '';
  render();
}
function openEditCandidate(nomor){
  const c = state.candidates.find(x => String(x.nomor) === String(nomor));
  if(!c) return;
  state.editingCandidate = {...c};
  state.photoBase64 = null; state.photoType = null; state.photoName = null;
  state.formError = '';
  render();
}
function closeCandidateModal(){
  state.editingCandidate = null;
  render();
}

function readPhotoFile(file){
  return new Promise((resolve, reject) => {
    if(!file){ resolve(null); return; }
    if(!file.type.startsWith('image/')){ reject(new Error('File harus berupa gambar.')); return; }
    if(file.size > 5*1024*1024){ reject(new Error('Ukuran file maksimal 5 MB.')); return; }
    const reader = new FileReader();
    reader.onload = () => resolve({base64: reader.result.split(',')[1], type: file.type, name: file.name});
    reader.onerror = () => reject(new Error('Gagal membaca file foto.'));
    reader.readAsDataURL(file);
  });
}

async function saveCandidate(){
  state.formError = '';
  const nomor = document.getElementById('cf-nomor').value.trim();
  const kelas = document.getElementById('cf-kelas').value.trim();
  const nama = document.getElementById('cf-nama').value.trim();
  const visi = document.getElementById('cf-visi').value.trim();
  const misi = document.getElementById('cf-misi').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!nomor || !kelas || !nama){ state.formError = 'Nomor, nama, dan kelas wajib diisi.'; render(); return; }

  const fotoInput = document.getElementById('cf-foto');
  const file = fotoInput.files && fotoInput.files[0];

  state.submitting = true; render();
  try{
    let photo = null;
    if(file) photo = await readPhotoFile(file);
    const payload = {action:'saveCandidate', nomor, kelas, nama, visi, misi};
    if(photo){ payload.foto = photo.base64; payload.fotoType = photo.type; payload.fotoName = photo.name; }
    const res = await apiPost(payload);
    state.submitting = false;
    if(!res.ok){ state.formError = res.error || 'Gagal menyimpan kandidat.'; render(); return; }
    state.editingCandidate = null;
    state.netOk = 'Kandidat berhasil disimpan.';
    await loadAll();
  }catch(err){
    state.submitting = false;
    state.formError = err.message || 'Gagal menyimpan kandidat.';
    render();
  }
}

function askDelete(nomor){
  const c = state.candidates.find(x => String(x.nomor) === String(nomor));
  if(!c) return;
  state.deleteTarget = c;
  render();
}
async function confirmDelete(){
  const c = state.deleteTarget;
  if(!c) return;
  state.submitting = true; render();
  try{
    const res = await apiPost({action:'deleteCandidate', nomor: c.nomor});
    state.submitting = false;
    state.deleteTarget = null;
    if(!res.ok){ state.netError = res.error || 'Gagal menghapus kandidat.'; render(); return; }
    state.netOk = 'Kandidat dihapus.';
    await loadAll();
  }catch(err){
    state.submitting = false; state.deleteTarget = null;
    state.netError = 'Gagal terhubung ke server.'; render();
  }
}

/* ============ actions: publish hasil ============ */
function startPublish(){
  state.countdown = 5;
  render();
  const tick = () => {
    state.countdown -= 1;
    render();
    if(state.countdown > 0){ setTimeout(tick, 850); }
    else { setTimeout(doPublish, 900); }
  };
  setTimeout(tick, 850);
}
async function doPublish(){
  try{
    const res = await apiPost({action:'publishResult', published:true});
    if(!res.ok){ state.netError = res.error || 'Gagal mengumumkan hasil.'; }
    else { state.netOk = 'Hasil final sudah diumumkan ke siswa.'; }
  }catch(err){
    state.netError = 'Gagal terhubung ke server.';
  }
  state.countdown = null;
  await loadAll();
}
async function unpublish(){
  state.submitting = true; render();
  try{
    const res = await apiPost({action:'publishResult', published:false});
    state.submitting = false;
    if(!res.ok){ state.netError = res.error || 'Gagal membatalkan pengumuman.'; render(); return; }
    state.netOk = 'Pengumuman dibatalkan, siswa kembali melihat pemantauan partisipasi.';
    await loadAll();
  }catch(err){
    state.submitting = false;
    state.netError = 'Gagal terhubung ke server.'; render();
  }
}

/* ============ event delegation ============ */
app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action === 'login'){ handleLogin(); }
  else if(action === 'logout'){
    if(state.pollHandle) clearInterval(state.pollHandle);
    Object.assign(state, {screen:'login', admin:null, loginError:'', candidates:[], netError:'', netOk:'', editingCandidate:null, deleteTarget:null, tally:null, published:false, pollHandle:null});
    render();
  }
  else if(action === 'tab'){ state.tab = t.dataset.tab; state.netError=''; state.netOk=''; render(); }
  else if(action === 'add-candidate'){ openAddCandidate(); }
  else if(action === 'edit-candidate'){ openEditCandidate(t.dataset.nomor); }
  else if(action === 'close-candidate-modal'){ closeCandidateModal(); }
  else if(action === 'save-candidate'){ saveCandidate(); }
  else if(action === 'ask-delete'){ askDelete(t.dataset.nomor); }
  else if(action === 'close-delete-modal'){ state.deleteTarget = null; render(); }
  else if(action === 'confirm-delete'){ confirmDelete(); }
  else if(action === 'refresh-pantau'){ loadAll(); }
  else if(action === 'start-publish'){ startPublish(); }
  else if(action === 'unpublish'){ unpublish(); }
});

app.addEventListener('error', (e) => {
  const img = e.target;
  if(img.tagName === 'IMG' && img.dataset.fallback && !img.dataset.fallbackApplied){
    img.dataset.fallbackApplied = '1';
    img.src = 'https://api.dicebear.com/7.x/initials/svg?seed=' + img.dataset.fallback;
  }
}, true);

render();
</script>
</body>
</html>
